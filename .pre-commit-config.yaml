---
repos:

    # Standard fille formatting / hygiene
    - repo: https://github.com/pre-commit/pre-commit-hooks
      # See: https://github.com/pre-commit/pre-commit-hooks/releases
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          # The json format/linter/fixer does not like jsonc/json5 like the VS code stuff
          - id: check-json
            exclude: &vscode_json_exclude |
                (?x)^(
                    ^.vscode/.*\.json
                )$
          - id: pretty-format-json
            exclude: *vscode_json_exclude
            args:
                - --autofix
                # Note: this hook does not honor the .editorconfig value so
                #   they need to be kept in sync manually
                - --indent=4
                # Do not convert extended unicode characters to escape sequences
                - --no-ensure-ascii

    # Fix any markdown issues w/ the rendered docs
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.1
      hooks:
          - id: markdownlint-cli2

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.3
      hooks:
          # Lint, fixing what can be automatically fixed
          - id: ruff-check
            args:
                - --fix
          # Format to ensure consistent style
          - id: ruff-format

    # Meta / Docs ... etc
    ##
    - repo: https://github.com/woodruffw/zizmor-pre-commit
      # Zizmor version.
      rev: v1.26.1
      hooks:
          - id: zizmor

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 43.272.6
      hooks:
          - id: renovate-config-validator
            args:
                - --strict

    - repo: https://github.com/ericmjl/webp-pre-commit
      rev: v0.0.12
      hooks:
          - id: convert-to-webp
            # DO NOT convert any of the favico files in static
            exclude: |
                (?x)^(
                    (static/(?:android-chrome-\d+x\d+|apple-touch-icon|favicon(?:-\d+x\d+)?|favicon)\.(?:png|ico))
                )$

    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v4.4.0
      hooks:
          - id: conventional-pre-commit
            stages:
                - commit-msg
            args: []

    - repo: local
      hooks:
          - id: check-tool-analytics
            name: Check HTML tools include analytics.js
            entry: mise run check:analytics --
            language: system
            files: ^content/tools/html/.*/tool\.html$
            pass_filenames: true
