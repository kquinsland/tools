# Fix any fixable errors
fix: true

# Ignore files referenced by .gitignore (only valid at root)
gitignore: true

config:
    # Don't enforce line-length
    MD013: false
    # In line HTML, allow it
    MD033: False

    # MD025/single-title/single-h1 : Multiple top-level headings in the same document : https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md025.md
    MD025:
        # Empty string to disable automatic title detection from the front matter
        front_matter_title: ""

# Define glob expressions to ignore
ignores:
    # Ignore everything in archetypes folder
    - archetypes/*.md
    # And the entire PROBLEM.md
    - PROBLEM.md
    # Ci/script generated changelog
    - content/tools/**/changelog.md
    # Release Please changelogs
    - CHANGELOG.md

# Disable banner message on stdout (only valid at root)
noBanner: true

# Disable inline config comments
noInlineConfig: false

# Disable progress on stdout (only valid at root)
noProgress: true

# Use a specific formatter (only valid at root)
outputFormatters:
    - - markdownlint-cli2-formatter-default

# Show found files on stdout (only valid at root)
showFound: true
