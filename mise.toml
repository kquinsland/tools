[settings]
# Push the MISE managed path to the front of the PATH variable
activate_aggressive = true
env_cache = true
exec_auto_install = true
github_attestations = true
# https://mise.jdx.dev/dev-tools/mise-lock.html#enabling-lockfiles
lockfile = true
pin = true
slsa = true

[task_config]
includes = ["mise/tasks"]

[settings.python]
uv_venv_auto = "create|source" # create .venv if missing, then activate

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true


[tools]
pinact = "4.1.0"
python = "3.14.6"
hugo-extended = "0.163.3"

"npm:markdownlint-cli2" = "0.22.1"
prek = "0.4.5"
ruff = "0.15.18"


# Let uv manage project environments and dependencies while mise pins the CLI.
uv = "0.11.23"

# For simulating/running some of the GH/A actions locally.
act = "0.2.89"
kind = "0.32.0"

# Render changelogs and GitHub release bodies.
# See: https://github.com/orhun/git-cliff
git-cliff = "2.13.1"
ty = "0.0.51"
bun = "1.3.14"
