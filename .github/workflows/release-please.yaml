---
name: Release Please

on:
    push:
        branches:
            - main

concurrency:
    group: release-please
    cancel-in-progress: false

permissions: {}

defaults:
    run:
        shell: bash

jobs:
    check-generated:
        name: check generated files
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout Repo
              id: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup mise toolchain
              id: setup_mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
              with:
                  # renovate: datasource=github-tags depName=jdx/mise versioning=loose
                  version: 2026.4.18
                  install: true
                  install_args: python uv
                  cache: true
                  github_token: ${{ github.token }}
                  experimental: false
                  log_level: ${{ env.ACTIONS_STEP_DEBUG && 'debug' || 'info' }}

            - name: Check generated files
              id: check_generated
              run: mise run check:generated

    release-please:
        name: release-please
        needs: check-generated
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            sha: ${{ steps.release.outputs.sha }}
            tag_name: ${{ steps.release.outputs.tag_name }}

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    deploy-pages:
        name: deploy GitHub Pages
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: ./.github/workflows/pages.yaml
        permissions:
            contents: read
            pages: write
            id-token: write
        with:
            ref: ${{ needs.release-please.outputs.sha }}
