---
name: Pre-Commit

# Set default permissions to empty, make zizmor happy
permissions: {}

on:
    # Should it be needed, allow manual triggering
    workflow_dispatch: # Validate pull requests, including release-please release PRs.

    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    pre-commit:
        name: run pre-commit hooks
        runs-on: ubuntu-latest
        permissions:
            # Required for workflows in private repositories
            contents: read

        steps:
            - name: Checkout Repo
              id: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup mise toolchain
              id: setup_mise
              uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  # renovate: datasource=github-tags depName=jdx/mise versioning=loose
                  version: 2026.4.18
                  install: true
                  install_args: python uv
                  cache: true
                  github_token: ${{ github.token }}
                  experimental: false
                  log_level: ${{ env.ACTIONS_STEP_DEBUG && 'debug' || 'info' }}

            - name: Run pre-commit hooks
              id: check_pre_commit
              run: mise run lint
